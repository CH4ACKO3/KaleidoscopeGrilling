plugins {
    id 'net.neoforged.moddev' version '2.0.134'
}

apply from: rootProject.file('gradle/package-structure.gradle')

def props = new Properties()
file('gradle.properties').withInputStream { props.load(it) }

version = props.getProperty('mod_version')
group = props.getProperty('maven_group')

base { archivesName = props.getProperty('archives_base_name') }

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Create'; url = 'https://maven.createmod.net' } }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    exclusiveContent {
        forRepository { maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/snapshots' } }
        filter { includeGroup 'com.tterrag.registrate' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

neoForge {
    version = props.getProperty('neo_version')
    runs {
        client { client(); gameDirectory = project.file('runs/client'); programArgument('--username=Breezeth') }
        client2 { client(); gameDirectory = project.file('runs/client2'); programArgument('--username=Player2') }
        server { server(); gameDirectory = project.file('runs/server'); programArgument('--nogui') }
    }
    mods {
        kaleidoscope_grilling { sourceSet sourceSets.main }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    // Always package the optional KubeJS bridge; the flag only adds KubeJS to development runs.
    compileOnly 'maven.modrinth:sk9knFPE:cQ4POTah'
    compileOnly 'maven.modrinth:umyGl7zF:F2nzeC19'
    if (providers.gradleProperty('withKubeJS').isPresent()) {
        runtimeOnly 'maven.modrinth:sk9knFPE:cQ4POTah'
        runtimeOnly 'maven.modrinth:umyGl7zF:F2nzeC19'
    }
    implementation 'maven.modrinth:v17FatAc:TqaHu4Ma'
    def orderToCook = 'maven.modrinth:order-to-cook:2JGn0iYb'
    compileOnly orderToCook
    if (providers.gradleProperty('withOrderToCook').isPresent()) {
        runtimeOnly orderToCook
    }
    def localMaidJar = rootProject.file(".breezeth/dependencies/touhoulittlemaid-${props.getProperty('touhou_little_maid_version')}.jar")
    if (localMaidJar.exists()) {
        compileOnly files(localMaidJar)
        if (!providers.gradleProperty('withoutMaid').isPresent()) {
            runtimeOnly files(localMaidJar)
        }
    } else {
        compileOnly "maven.modrinth:touhou-little-maid:${props.getProperty('touhou_little_maid_version')}"
        if (!providers.gradleProperty('withoutMaid').isPresent()) {
            runtimeOnly "maven.modrinth:touhou-little-maid:${props.getProperty('touhou_little_maid_version')}"
        }
    }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.27.0.340'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340'
    compileOnly 'maven.modrinth:jade:15.10.5+neoforge'
    def createSlim = "com.simibubi.create:create-${props.getProperty('minecraft_version')}:${props.getProperty('create_version')}:slim"
    def ponder = "net.createmod.ponder:ponder-neoforge:${props.getProperty('ponder_version')}+mc${props.getProperty('minecraft_version')}"
    def flywheel = "dev.engine-room.flywheel:flywheel-neoforge-${props.getProperty('minecraft_version')}:${props.getProperty('flywheel_version')}"
    def registrate = "com.tterrag.registrate:Registrate:${props.getProperty('registrate_version')}"
    compileOnly(createSlim) { transitive = false }
    compileOnly ponder
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${props.getProperty('minecraft_version')}:${props.getProperty('flywheel_version')}"
    compileOnly registrate
    if (!providers.gradleProperty('withoutCreate').isPresent()) {
        runtimeOnly(createSlim) { transitive = false }
        runtimeOnly ponder
        runtimeOnly flywheel
        runtimeOnly registrate
    }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

tasks.withType(Jar).configureEach {
    archiveFileName = "kaleidoscope_grilling-${project.version}-neoforge1.21.1.jar"
    from(rootProject.file('LICENSE-CODE'))
    from(rootProject.file('LICENSE-ASSETS'))
    from(rootProject.file('NOTICE'))
}
